apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-mimir
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  mimir.yaml: |
    multitenancy_enabled: false
    blocks_storage:
      backend: filesystem
      bucket_store:
        sync_dir: /data/tsdb-sync
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
        replication_factor: 1
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/rules
    server:
      http_listen_port: 9009
      log_level: warn
    store_gateway:
      sharding_ring:
        replication_factor: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability.fullname" . }}-mimir
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mimir
          image: {{ .Values.images.mimir }}
          args: ["-config.file=/etc/mimir/mimir.yaml"]
          ports:
            - name: http
              containerPort: 9009
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/mimir}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: {{ include "observability.fullname" . }}-mimir}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.fullname" . }}-mimir
spec:
  selector:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 9009, targetPort: http}
