apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: opslab
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: opslab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: OpsLab
        folder: OpsLab
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-opslab-dashboard
  namespace: opslab
data:
  opslab.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum by (status) (rate(opslab_http_requests_total[5m]))", "legendFormat": "HTTP {{status}}"}],
          "title": "Request rate by status",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(opslab_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95"}],
          "title": "95th-percentile request duration",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 41,
      "tags": ["opslab", "learning"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "title": "OpsLab API Overview",
      "uid": "opslab-api"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: opslab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: opslab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: opslab-admin
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-opslab-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: opslab
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
