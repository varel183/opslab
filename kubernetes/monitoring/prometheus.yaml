apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: opslab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: opslab-api
        metrics_path: /metrics
        static_configs:
          - targets: ["opslab-api:8000"]
  rules.yml: |
    groups:
      - name: opslab
        rules:
          - alert: OpsLabApiDown
            expr: up{job="opslab-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: OpsLab API is unavailable
          - alert: OpsLabHighErrorRate
            expr: sum(rate(opslab_http_requests_total{status=~"5.."}[5m])) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: OpsLab API is returning repeated server errors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: opslab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: opslab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: opslab
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
